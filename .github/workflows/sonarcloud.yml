# SonarQube Cloud analysis (Maven).
# Requires repository secret: SONAR_TOKEN
# Project key / organization must match SonarQube Cloud (see tutorial / Administration → Analysis Method).
# Docs: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/ci-based-analysis/github-actions-for-sonarcloud/
---
name: SonarQube Cloud

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # skipTests: InjectedTest suite is heavy; drop -DskipTests when you want coverage.
        # organization / projectKey / host.url come from pom.xml <sonar.*> properties.
        run: mvn -B -DskipTests package org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
