<div>
  <p>Path within the KV v2 secrets engine mount.</p>
  <p>Example: <code>myapp/prod</code> with mount <code>secret</code> reads <code>/v1/secret/data/myapp/prod</code> (Manual) or Vault Plugin path <code>secret/myapp/prod</code>.</p>
  <p>Do not include a leading <code>data/</code> segment.</p>
</div>
