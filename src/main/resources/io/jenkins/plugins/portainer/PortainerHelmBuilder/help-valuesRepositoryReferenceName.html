<div>
  <p>Git reference for the values repository. Default: <code>refs/heads/main</code>.</p>
  <p>Examples:</p>
  <ul>
    <li><code>refs/heads/main</code></li>
    <li><code>refs/tags/v1.2.0</code></li>
    <li><code>refs/heads/${BRANCH_NAME}</code></li>
  </ul>
  <p>Jenkins maps heads/tags to a short name for shallow clone on the agent.</p>
</div>
