<div>
  <p>Inline Docker Compose / Swarm stack file content sent to Portainer as <code>StackFileContent</code>. Must be a YAML mapping with a non-empty <code>services</code> section.</p>
  <p>Do not put secrets in the YAML when you can use step <code>env</code> or Vault overlay instead. Build logs record only YAML length and a short content hash.</p>
</div>
